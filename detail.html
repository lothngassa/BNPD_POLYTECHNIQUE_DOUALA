<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mémoire | BNPD</title>
  <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <link rel="icon" href="logo.png">
  <script>
    (function () {
      var t = localStorage.getItem("bnpd-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bnpd.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="index.html" aria-label="BNPD, accueil">
        <img src="logo.png" alt="" width="30" height="35">
        <span class="brand-name">BNPD</span>
        <span class="brand-sub">Bibliothèque numérique<br>Polytechnique Douala</span>
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a class="nav-link" href="index.html">Explorer</a>
        <a class="btn btn-primary" href="submit.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <span>Déposer<span class="btn-label-long"> un mémoire</span></span>
        </a>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Basculer entre le thème clair et le thème sombre">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Tous les mémoires
    </a>
    <div id="detail" aria-live="polite">
      <div class="detail-grid">
        <div class="detail-aside skel"><div class="cover"></div></div>
        <div class="skel"><div class="line" style="height:44px;width:85%"></div><div class="line" style="height:44px;width:60%"></div><div class="line short"></div></div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <a class="brand" href="index.html"><img src="logo.png" alt="" width="22" height="26"><span class="brand-name">BNPD</span></a>
      <p>La bibliothèque numérique des mémoires de l'École Nationale Supérieure Polytechnique de Douala.</p>
      <p>Conçue et développée par <a href="https://lothngassa.com">Loth Ngassa</a></p>
    </div>
  </footer>

  <script type="module">
    import { API, FILIERES, esc, safeUrl, fmtDate, keywords, coverHTML, citation, fetchJSON, initTheme } from "./assets/app.js";
    import { EXEMPLES } from "./assets/exemples.js";

    initTheme();
    const box = document.getElementById("detail");
    const params = new URLSearchParams(location.search);

    const ICON_READ = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>`;
    const ICON_DL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>`;

    function fact(label, value) {
      return value ? `<div><dt>${label}</dt><dd>${esc(value)}</dd></div>` : "";
    }

    function render(m) {
      document.title = `${m.titre} | BNPD`;
      const pdf = safeUrl(m.fichier_pdf);
      const kws = keywords(m);
      const actions = pdf
        ? `<a class="btn btn-primary btn-lg" href="${esc(pdf)}" target="_blank" rel="noopener">${ICON_READ} Lire le mémoire</a>
           <a class="btn btn-ghost btn-lg" href="${esc(pdf)}" download>${ICON_DL} Télécharger le PDF</a>`
        : `<span class="btn btn-primary btn-lg" aria-disabled="true">${ICON_READ} Lire le mémoire</span>
           <p class="fine">Exemple fictif : aucun PDF n'est associé à cette fiche.</p>`;

      box.innerHTML = `
        <div class="detail-grid">
          <aside class="detail-aside">
            ${coverHTML(m, true)}
            <div class="actions">
              ${actions}
              <button class="btn btn-ghost" type="button" id="share">Copier le lien de la fiche</button>
            </div>
          </aside>
          <article>
            <p class="eyebrow">${esc(m.filiere)} / ${esc(FILIERES[m.filiere] || "")}</p>
            <h1 class="detail-title">${esc(m.titre)}</h1>
            <p class="byline">par <strong>${esc(m.auteur)}</strong>, soutenu en ${esc(m.annee)}</p>
            <dl class="facts">
              ${fact("Filière", FILIERES[m.filiere] || m.filiere)}
              ${fact("Axe de spécialisation", m.axe_recherche)}
              ${fact("Matricule", m.matricule)}
              ${fact("Année de soutenance", m.annee)}
              ${fact("Déposé le", fmtDate(m.date_soumission))}
            </dl>
            ${kws.length ? `<div class="keywords">${kws.map((k) => `<span class="kw">${esc(k)}</span>`).join("")}</div>` : ""}
            <div class="prose">
              <h2>Résumé</h2>
              <p>${m.resume ? esc(m.resume) : "L'auteur n'a pas encore ajouté de résumé."}</p>
            </div>
            <section class="cite">
              <h2>Citer ce mémoire</h2>
              <p id="cite-text">${citation(m)}</p>
              <button class="btn btn-ghost" type="button" id="copy-cite">Copier la référence</button>
            </section>
          </article>
        </div>`;

      const copy = (btn, text, done) => {
        navigator.clipboard.writeText(text).then(() => {
          const label = btn.textContent;
          btn.textContent = done;
          setTimeout(() => (btn.textContent = label), 1800);
        });
      };
      document.getElementById("copy-cite").addEventListener("click", (e) =>
        copy(e.currentTarget, document.getElementById("cite-text").textContent, "Référence copiée"));
      document.getElementById("share").addEventListener("click", (e) => copy(e.currentTarget, location.href, "Lien copié"));
    }

    function notFound(message) {
      box.innerHTML = `<div class="empty"><h3>Fiche introuvable</h3><p>${message}</p><p><a class="btn btn-ghost" href="index.html">Retour à la bibliothèque</a></p></div>`;
    }

    async function load() {
      const exId = params.get("exemple");
      const id = params.get("id");
      if (exId) {
        const m = EXEMPLES.find((e) => e.id === exId);
        return m ? render(m) : notFound("Cet exemple n'existe pas.");
      }
      if (!id || !/^\d+$/.test(id)) return notFound("Le lien ne désigne aucun mémoire.");
      try {
        render(await fetchJSON(`${API}${id}/`));
      } catch {
        notFound("Ce mémoire n'existe pas, ou le serveur ne répond pas pour le moment.");
      }
    }

    load();
  </script>
</body>
</html>
